[package]
name = "srp6"
version = "1.0.0-rc.1"
authors = ["Sven Kanoldt <sven@d34dl0ck.me>"]
repository = "https://github.com/sassman/srp6-rs"
categories = ["cryptography"]
keywords = [
    "srp",
    "authentication",
    "key-exchange",
    "protocols",
]
edition = "2018"
rust-version = "1.87"
description = "A safe implementation of the secure remote password authentication and key-exchange protocol - SRP version 6 and 6a"
license = "MIT"
include = ["src", "examples", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
thiserror = "2.0"
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
crypto-bigint = { version = "=0.7.10", default-features = false, features = [
    "alloc",
    "extra-sizes",
] }
serde = { version = "1.0", features = ["derive"] }
subtle = { version = "2.6", default-features = false }
sha1 = { version = "^0.11", optional = true }
sha2 = { version = "^0.11", optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["hash-sha512"]

hash-sha512 = ["dep:sha2"]
hash-sha1 = ["dep:sha1"]

# Sub-2048-bit RFC 5054 groups (Group1024 / Group1536). Below current practice —
# opt in knowingly; production should use a >= 2048-bit group.
weak = []

# World of Warcraft 1.12.1 (build 5875) only: k = 3, uppercased credentials and the 256-bit group.
#
# WARNING: do not use this for modern, production-grade applications. Its
# cryptographic parameters are far below current practice: SHA-1 as the hash, and a
# 256-bit modulus are not safe for production anylonger.
# Its a legacy feature only.
wow-1-12-1 = ["hash-sha1"]

# RFC 5054 appendix B uses the 1024-bit group, so it needs `weak`.
test-rfc-5054-appendix-b = ["hash-sha1", "weak"]
