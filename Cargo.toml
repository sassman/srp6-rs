[package]
name = "srp6"
version = "1.0.0-beta.2"
authors = ["Sven Kanoldt <sven@d34dl0ck.me>"]
repository = "https://github.com/sassman/srp6-rs"
categories = ["cryptography"]
keywords = [
    "srp",
    "authentication",
    "key-exchange",
    "protocols",
]
edition = "2018"
description = "A safe implementation of the secure remote password authentication and key-exchange protocol - SRP version 6 and 6a"
license = "MIT"
include = ["src", "examples", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
thiserror = "2.0"
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
num-bigint = { version = "0.4", default-features = false }
num-traits = "0.2"
crypto-bigint = { version = "=0.7.10", optional = true, default-features = false, features = [
    "alloc",
] }
hex-literal = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha1 = { version = "^0.11", optional = true }
sha2 = { version = "^0.11", optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["hash-sha512"]

hash-sha512 = ["dep:sha2"]
hash-sha1 = ["dep:sha1"]

# swaps the arithmetic backend to crypto-bigint; the public API and byte formats
# stay the same, only the representation behind them changes.
crypto-bigint = ["dep:crypto-bigint"]

# World of Warcraft 1.12.1 (build 5875) only: k = 3, uppercased credentials and
# the 256-bit group in `src/wow.rs`. Later clients changed the flavour, so the
# version is part of the name rather than implied.
#
# WARNING: do not use this for modern, production-grade applications. Its
# cryptographic parameters are far below current practice: SHA-1 as the hash, and a
# 256-bit modulus where this crate asks for >= 2048 bit in production. It exists to
# talk to a client that shipped in 2006.
wow-1-12-1 = ["hash-sha1"]

test-rfc-5054-appendix-b = ["hash-sha1"]
